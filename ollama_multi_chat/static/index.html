<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ollama Multi Chat</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="layout">
      <header class="topbar">
        <h1>Ollama Multi Chat</h1>
        <div id="status" class="status">Готово</div>
      </header>

      <section class="panel settings">
        <h2>Подключение</h2>
        <div class="grid">
          <label>
            Host
            <input id="host" type="text" value="http://127.0.0.1:11434" />
          </label>
          <label>
            Timeout
            <input id="timeout" type="number" step="1" value="45" />
          </label>
          <label>
            Delay
            <input id="delay" type="number" step="0.1" value="2.0" />
          </label>
        </div>
        <div class="row">
          <button id="saveConfig">Сохранить и проверить</button>
          <button id="refreshModels">Обновить модели</button>
        </div>
      </section>

      <section class="panel agents">
        <h2>Агенты</h2>
        <div class="agent-list-wrap">
          <ul id="agents"></ul>
        </div>

        <h3>Добавить агента</h3>
        <div class="grid">
          <label>
            Имя
            <input id="agentName" type="text" />
          </label>
          <label>
            Модель
            <select id="agentModel"></select>
          </label>
          <label>
            Пресет
            <select id="promptPreset"></select>
          </label>
        </div>
        <label>
          System prompt
          <textarea id="systemPrompt" rows="4"></textarea>
        </label>
        <div class="row">
          <button id="addAgent">Подключить</button>
          <button id="removeAgent" class="danger">Удалить выбранного</button>
        </div>

        <h3>Комментатор</h3>
        <div id="commentatorStatus" class="hint">Не подключен</div>
        <div class="grid">
          <label>
            Имя
            <input id="commentatorName" type="text" value="Аналитик" />
          </label>
          <label>
            Модель
            <select id="commentatorModel"></select>
          </label>
          <label>
            Пресет
            <select id="commentatorPreset"></select>
          </label>
        </div>
        <label>
          Prompt комментатора
          <textarea id="commentatorPrompt" rows="4"></textarea>
        </label>
        <div class="row">
          <button id="setCommentator">Подключить комментатора</button>
          <button id="clearCommentator" class="danger">Отключить</button>
        </div>
      </section>

      <section class="panel chat">
        <h2>Диалог И Комментарии</h2>
        <div class="history-grid">
          <div class="history-wrap">
            <h3>Основной чат</h3>
            <div id="history" class="history"></div>
          </div>
          <div class="history-wrap">
            <h3>Комментарии комментатора</h3>
            <div id="commentatorHistory" class="history"></div>
          </div>
        </div>
        <label>
          Ваше сообщение
          <textarea id="userText" rows="3" placeholder="Enter = отправить, Shift+Enter = новая строка"></textarea>
        </label>
        <div class="row">
          <button id="sendMessage">Отправить</button>
          <button id="startChat" class="primary">Старт</button>
          <button id="stopChat">Стоп</button>
          <button id="resetChat">Сброс</button>
        </div>
      </section>
    </main>

    <script src="/static/app.js" type="module"></script>
  </body>
</html>
