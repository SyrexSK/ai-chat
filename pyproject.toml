[project]
name = "ollama-multi-chat"
version = "0.2.0"
description = "Desktop and CLI multi-model chat for local Ollama"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ollama-multi-chat = "ollama_multi_chat.gui:main"
ollama-multi-chat-cli = "ollama_multi_chat.cli:main"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"
